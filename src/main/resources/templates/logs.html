<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logs de Eventos - SVITS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h4>SVITS</h4>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/profile}" class="menu-item" th:classappend="${activePage == 'profile' ? 'active' : ''}" sec:authorize="isAuthenticated()">
                <i class="fas fa-user" aria-hidden="true"></i>
                <span>Perfil</span>
            </a>
            <a th:href="@{/dashboard}" class="menu-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}" sec:authorize="isAuthenticated()">
                <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/umbrales}" class="menu-item" th:classappend="${activePage == 'umbrales' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                <span>Umbrales</span>
            </a>
            <a th:href="@{/correo}" class="menu-item" th:classappend="${activePage == 'correo' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <span>Alertas</span>
            </a>
            <a th:href="@{/logs}" class="menu-item" th:classappend="${activePage == 'logs' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <i class="fas fa-file-alt" aria-hidden="true"></i>
                <span>Logs</span>
            </a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="margin:0; padding:0;">
                <button type="submit" class="menu-item logout-button">
                    <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </form>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <header class="dashboard-header">
            <h1>Historial de Logs del Sistema</h1>
        </header>
        <div class="container mt-4">
            <section class="data-table-section">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nivel</th>
                            <th>Mensaje</th>
                            <th>Detalles</th>
                            <th>Origen</th>
                            <th>Fecha Registro</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td th:text="${log.id}">1</td>
                            <td th:text="${log.nivel}">INFO</td>
                            <td th:text="${log.mensaje}">Mensaje</td>
                            <td th:text="${log.detalles}">Detalles</td>
                            <td th:text="${log.origen}">Origen</td>
                            <td th:text="${#temporals.format(log.fechaRegistro, 'dd-MM-yyyy HH:mm:ss')}">Fecha</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="6" class="text-center">No hay registros disponibles.</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
