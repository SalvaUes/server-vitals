<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración de Umbrales - SVITS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h4>SVITS</h4>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/profile}" class="menu-item" th:classappend="${activePage == 'profile' ? 'active' : ''}" sec:authorize="isAuthenticated()">
                <i class="fas fa-user" aria-hidden="true"></i>
                <span>Perfil</span>
            </a>
            <a th:href="@{/dashboard}" class="menu-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}" sec:authorize="isAuthenticated()">
                <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/umbrales}" class="menu-item" th:classappend="${activePage == 'umbrales' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                <span>Umbrales</span>
            </a>
            <a th:href="@{/correo}" class="menu-item" th:classappend="${activePage == 'correo' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <span>Alertas</span>
            </a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="margin:0; padding:0;">
                <button type="submit" class="menu-item logout-button">
                    <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </form>
        </div>
    </div>
    <div class="main-content" id="mainContent">
        <header class="dashboard-header">
            <h1>Configuración de Umbrales</h1>
        </header>
        <div class="container mt-4">
            <section class="config-section">
                <h2>Nuevo Umbral de Alerta</h2>
                <form th:action="@{/umbrales/guardar}" th:object="${umbral}" method="post" class="p-4 border rounded-3 bg-light">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="tipoRecurso" class="form-label">Recurso Monitoreado</label>
                            <select id="tipoRecurso" th:field="*{tipoRecurso}" class="form-select" required>
                                <option value="">-- Seleccione --</option>
                                <option value="CPU">CPU</option>
                                <option value="RAM">RAM</option>
                                <option value="DISCO">Disco</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="porcentaje" class="form-label">Activar Alerta al Superar (%)</label>
                            <input type="number" id="porcentaje" th:field="*{porcentaje}" class="form-control" placeholder="Ej: 85" step="0.1" min="0" max="100" required />
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="nivelAlerta" class="form-label">Nivel de Alerta</label>
                            <select id="nivelAlerta" th:field="*{nivelAlerta}" class="form-select" required>
                                <option value="">-- Seleccione --</option>
                                <option th:each="nivel : ${T(com.svit.server_vitals.model.NivelAlerta).values()}"
                                        th:unless="${nivel.toString() == 'NORMAL'}"
                                        th:value="${nivel}"
                                        th:text="${#strings.capitalize(nivel.toString().toLowerCase())}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Guardar Umbral</button>
                </form>
            </section>
            <section class="data-table-section mt-5">
                <h2>Umbrales Actuales</h2>
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Recurso</th>
                            <th>Nivel de Alerta</th>
                            <th>Porcentaje (%)</th>
                            <th>Fecha Configuración</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${listaUmbrales}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.tipoRecurso}"></td>
                            <td th:text="${u.nivelAlerta}"></td>
                            <td th:text="${u.porcentaje}"></td>
                            <td th:text="${#temporals.format(u.fechaConfiguracion, 'dd-MM-yyyy HH:mm:ss')}"></td>
                            <td>
                                <form th:action="@{/umbrales/eliminar/{id}(id=${u.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaUmbrales)}">
                            <td colspan="6" class="text-center">No hay umbrales configurados.</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
