<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>SVITS - Configuración de Alertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h4>SVITS</h4>
        </div>
        <div class="sidebar-menu">
            <a th:href="@{/profile}" class="menu-item" th:classappend="${activePage == 'profile' ? 'active' : ''}" sec:authorize="isAuthenticated()">
                <i class="fas fa-user" aria-hidden="true"></i>
                <span>Perfil</span>
            </a>
            <a th:href="@{/dashboard}" class="menu-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}" sec:authorize="isAuthenticated()">
                <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/umbrales}" class="menu-item" th:classappend="${activePage == 'umbrales' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <i class="fas fa-sliders-h" aria-hidden="true"></i>
                <span>Umbrales</span>
            </a>
            <a th:href="@{/correo}" class="menu-item" th:classappend="${activePage == 'correo' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <span>Alertas</span>
            </a>
             <a th:href="@{/logs}" class="menu-item" th:classappend="${activePage == 'logs' ? 'active' : ''}" sec:authorize="hasAuthority('ROLE_ADMIN')">
               <i class="fas fa-file-alt" aria-hidden="true"></i>
             <span>Logs</span>
            </a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="margin:0; padding:0;">
                <button type="submit" class="menu-item logout-button">
                    <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </form>
        </div>
    </div>
    <div class="main-content" id="mainContent">
        <header class="dashboard-header">
            <h1>SVITS - Configuración de Alertas</h1>
        </header>

        <div class="container mt-4 mb-5">
            <div th:if="${exito_guardado}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong th:text="${exito_guardado}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${exito_eliminado}" class="alert alert-info alert-dismissible fade show" role="alert">
                <strong th:text="${exito_eliminado}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error_guardado}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong th:text="${error_guardado}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <section class="config-section mb-5">
                <h2>Configurar Nueva Notificación de Alerta</h2>
                <form th:action="@{/correo/guardar}" th:object="${nuevaAlerta}" method="post" class="p-4 border rounded-3 bg-light">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="correoDestino" class="form-label">Correo Destinatario</label>
                            <input type="email" class="form-control" id="correoDestino" th:field="*{correoDestino}" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="tipoRecurso" class="form-label">Asociar a Recurso</label>
                            <select id="tipoRecurso" th:field="*{tipoRecurso}" class="form-select" required>
                                <option value="">-- Seleccione un recurso --</option>
                                <option value="CPU">CPU</option>
                                <option value="RAM">RAM</option>
                                <option value="DISCO">DISCO</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="intervaloMinutos" class="form-label">Enviar Correo de Resumen Cada:</label>
                            <select id="intervaloMinutos" th:field="*{intervaloMinutos}" class="form-select" required>
                                <option value="30">30 Minutos</option>
                                <option value="60">1 Hora</option>
                                <option value="120">2 Horas</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="mensaje" class="form-label">Mensaje Personalizado</label>
                            <textarea class="form-control" id="mensaje" th:field="*{mensaje}" rows="3" required placeholder="Ej: ¡Atención! El recurso CPU ha superado el umbral crítico."></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">Guardar Alerta</button>
                        </div>
                    </div>
                </form>
            </section>

            <hr class="my-5">

            <h2 class="mt-4">Alertas Guardadas</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Correo Destino</th>
                            <th>Recurso Asociado</th>
                            <th>Mensaje</th>
                            <th>Frecuencia (min)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="alerta : ${listaAlertas}">
                            <td th:text="${alerta.id}"></td>
                            <td th:text="${alerta.correoDestino}"></td>
                            <td th:text="${alerta.tipoRecurso}"></td>
                            <td th:text="${alerta.mensaje}"></td>
                            <td th:text="${alerta.intervaloMinutos}"></td>
                            <td>
                                <form th:action="@{/correo/eliminar/{id}(id=${alerta.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaAlertas)}">
                            <td colspan="6" class="text-center">No hay alertas configuradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
