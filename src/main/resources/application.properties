

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/svits_local_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:localuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:localpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your_gmail_username@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_gmail_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

spring.datasource.initialization-mode=always

management.endpoints.web.exposure.include=*




